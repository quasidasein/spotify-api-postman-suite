name: Spotify API Automated Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Collection via Newman
        run: |
          newman run spotify_collection.json \
            --env-var "client_id=${{ secrets.SPOTIFY_CLIENT_ID }}" \
            --env-var "client_secret=${{ secrets.SPOTIFY_CLIENT_SECRET }}"